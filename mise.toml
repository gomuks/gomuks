# gomuks fork local deployment (mirrors ../pi-plugins mise pattern)
# server = daemon (cmd/gomuks, SINGLETON) · client = terminal (cmd/gomuks-terminal, MULTIPLE)

[tasks.deploy]
run = "bash ops/deploy/deploy-local.sh"
description = "SERVER: build (noweb) → ~/.local/bin/gomuks-dev. Shares prod config for parity."

[tasks.deploy-client]
run = "MODE=client bash ops/deploy/deploy-local.sh"
description = "CLIENT: build terminal → ~/.local/bin/gomuks-terminal-dev. Multi-install: BIN_NAME=gomuks-terminal-dev2 for extra copies."

[tasks.deploy-full]
run = "DEPLOY_FULL=1 bash ops/deploy/deploy-local.sh"
description = "SERVER full build (web assets via ./build.sh) → gomuks-dev. Needs web npm ci."

[tasks.deploy-prod]
run = "BIN_NAME=gomuks-daemon-patched bash ops/deploy/deploy-local.sh"
description = "Deploy to PROD daemon bin (gomuks-daemon-patched). Overwrites live daemon bin."

[tasks.deploy-status]
run = "bash ops/deploy/deploy-local.sh --status"
description = "Show deployed bin manifests (mode, commit, branch, time)."
